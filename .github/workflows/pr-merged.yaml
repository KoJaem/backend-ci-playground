name: Detect PR Merge with changedDTO Label

on:
  pull_request:
    types: [closed]

jobs:
  check-label-and-trigger:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR contains 'changedDTO' label
        id: check-label
        run: |
          LABELS=$(echo '${{ toJson(github.event.pull_request.labels) }}' | jq -r '.[].name')
          if echo "$LABELS" | grep -q "changedDTO"; then
            echo "match=true" >> $GITHUB_ENV
          else
            echo "match=false" >> $GITHUB_ENV
          fi

      - name: Trigger KoJaem/balance-game-api workflow
        if: env.match == 'true'
        run: |
          curl -X POST -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.PERSONAL_ACCESS_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -d '{"event_type": "trigger-build"}' \
          https://api.github.com/repos/KoJaem/balance-game-api/dispatches
